services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: citationchat
      POSTGRES_USER: citationchat
      POSTGRES_PASSWORD: citationchat
    ports:
      - "5432:5432"
    volumes:
      - citationchat_db:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citationchat -d citationchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - ./api/.env
    environment:
      APP_ENV: prod
      API_PREFIX: /api
      DATABASE_URL: postgresql+asyncpg://citationchat:citationchat@db:5432/citationchat
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  citationchat_db:
