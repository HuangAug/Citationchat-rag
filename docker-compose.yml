services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: citationchat
      POSTGRES_USER: citationchat
      POSTGRES_PASSWORD: citationchat
    ports:
      - "5432:5432"
    volumes:
      - citationchat_db:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citationchat -d citationchat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  citationchat_db:
